base_image: kaspernj/tensorbuzz-base-ubuntu-26-04:latest
before_install:
  - sudo apt-get update
  - sudo apt-get install -y --no-install-recommends php-cli php-curl php-mbstring php-xml composer git unzip
before_script:
  - composer install --no-interaction --prefer-dist
builds:
  tests:
    paths:
      - src/**
      - tests/**
      - composer.json
      - phpunit.xml.dist
      - .github/**
    script:
      - composer validate --strict
      - composer test
  compatibility:
    paths:
      - src/**
      - composer.json
      - phpcs.xml.dist
      - .github/**
    script:
      - composer phpcs
